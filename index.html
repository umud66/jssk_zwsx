<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="江苏省2026年度公务员职位筛选工具，支持按城市、学历、专业等条件筛选，收藏职位并保存搜索条件。">
    <meta name="theme-color" content="#5752ac">
    <meta name="format-detection" content="telephone=no">
    <title>江苏省2026年度考试录用公务员职位筛选系统</title>
    <style>
        :root {
            color-scheme: light;
            --accent: #5752ac;
            --accent-hover: #45418c;
            --accent-soft: #eeedf9;
            --text: #252538;
            --muted: #636477;
            --line: #dedee9;
            --surface: #fff;
            --background: #f5f5fa;
            --radius: 10px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--background); color: var(--text); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        button, input, select { font: inherit; }
        button, summary, select { cursor: pointer; }
        button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
        button { touch-action: manipulation; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        ::selection { background: #dddaf5; color: #292552; }
        input { accent-color: var(--accent); caret-color: var(--accent); }
        h1, h2, h3, p { margin: 0; }
        h1, h2, h3 { line-height: 1.4; text-wrap: balance; }
        a { color: var(--accent); text-underline-offset: 4px; }
        svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
        [hidden] { display: none !important; }
        .skip-link { position: fixed; top: -80px; left: 16px; z-index: 5; padding: 12px 20px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); }
        .skip-link:focus { top: 12px; }
        .page-header { background: linear-gradient(115deg, #5752ac, #6c58a0); color: #fff; }
        .header-inner { max-width: 1440px; margin: auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-mark { width: 34px; height: 34px; padding: 7px; border: 1px solid #bdb6de; border-radius: 8px; }
        h1 { font-size: 20px; font-weight: 650; letter-spacing: .01em; }
        .total-stats { color: #eeecfa; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .workspace { max-width: 1440px; margin: 0 auto; padding: 28px 32px 40px; display: grid; grid-template-columns: 306px minmax(0, 1fr); gap: 28px; align-items: start; }
        .filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; position: sticky; top: 20px; max-height: calc(100dvh - 40px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #b8b5cc transparent; }
        .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .section-title h2 { font-size: 18px; }
        .text-button { border: 0; background: transparent; color: var(--accent); padding: 8px 4px; min-height: 44px; }
        .text-button:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 4px; }
        .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .filter-group.wide { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: 600; color: #48485e; }
        input, select { width: 100%; min-width: 0; height: 44px; padding: 9px 10px; border: 1px solid #cfcfdd; border-radius: 7px; background: var(--surface); color: var(--text); }
        input::placeholder { color: #767686; font-size: 13px; }
        input:hover, select:hover { border-color: #a4a0c3; }
        input:focus, select:focus { border-color: var(--accent); }
        .field-help { color: var(--muted); font-size: 12px; line-height: 1.6; }
        .advanced-filters { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 15px; }
        summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; list-style: none; font-size: 14px; font-weight: 600; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: ''; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-right: 4px; flex-shrink: 0; }
        details[open] > summary::after { transform: rotate(225deg); }
        .advanced-grid { display: grid; gap: 14px; padding-top: 12px; }
        .filter-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 9px 14px; color: #49495f; font-weight: 550; font-size: 14px; transition: background-color .15s, border-color .15s; }
        .btn:hover:not(:disabled) { border-color: #aba6ce; background: #f5f4fc; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
        .saved-searches { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 18px; }
        .history-row { padding: 14px 0; border-top: 1px solid var(--line); }
        .history-row p { overflow-wrap: anywhere; font-size: 13px; }
        .history-row time { color: var(--muted); display: block; font-size: 12px; margin-bottom: 6px; }
        .history-actions { display: flex; gap: 8px; margin-top: 8px; }
        .history-actions .btn { min-height: 40px; padding: 5px 12px; }
        .results { min-width: 0; }
        .results-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
        .view-switch { display: flex; gap: 4px; background: #eae9f2; padding: 4px; border-radius: 8px; }
        .view-button { border: 0; background: transparent; border-radius: 5px; min-height: 40px; padding: 8px 16px; color: var(--muted); font-size: 14px; }
        .view-button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 650; box-shadow: 0 1px 3px #28214b12; }
        .favorites-count { font-variant-numeric: tabular-nums; margin-left: 4px; }
        .sort-group { display: flex; align-items: center; gap: 8px; }
        .sort-group select { width: auto; font-size: 13px; padding: 7px 8px; height: 40px; }
        .sort-group label { color: var(--muted); font-weight: 400; }
        .results-heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; margin: 22px 0 14px; }
        .results-heading h2 { font-size: 17px; font-weight: 500; }
        .result-count { font-size: 23px; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
        .results-meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
        .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .filter-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 10px; border: 1px solid #d6d2ec; border-radius: 6px; background: var(--accent-soft); color: #504a87; min-height: 36px; font-size: 12px; overflow-wrap: anywhere; text-align: left; }
        .filter-chip svg { width: 14px; height: 14px; }
        .job-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px 0; margin-bottom: 14px; overflow-wrap: anywhere; }
        .job-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
        .job-title { font-size: 18px; font-weight: 650; }
        .job-unit { color: var(--muted); font-size: 14px; margin-top: 5px; }
        .favorite-button { flex-shrink: 0; min-width: 44px; padding: 8px 10px; font-weight: 400; }
        .favorite-button svg { width: 17px; height: 17px; }
        .favorite-button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: #d2cdea; }
        .favorite-button[aria-pressed="true"] svg { fill: #dedaf4; }
        .job-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
        .tag { display: inline-block; padding: 3px 9px; border-radius: 4px; background: #f1f1f6; color: #57576c; font-size: 12px; }
        .tag.location { background: var(--accent-soft); color: #51499a; }
        .tag.recruit { background: #e9f3ee; color: #30674e; }
        .job-requirements { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 9px 12px; margin: 17px 0; font-size: 14px; }
        .job-requirements dt { color: var(--muted); }
        .job-requirements dd { margin: 0; white-space: pre-line; }
        .job-details { border-top: 1px solid #ecebf2; font-size: 13px; }
        .job-details summary { color: var(--accent); font-weight: 500; min-height: 46px; }
        .job-details .job-requirements { margin: 5px 0 16px; grid-template-columns: 70px minmax(0, 1fr); }
        .detail-actions { padding-bottom: 18px; }
        .pagination { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
        .page-controls { display: flex; align-items: center; gap: 8px; }
        .page-status { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
        .pagination select { width: auto; font-size: 13px; }
        .page-jump { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
        .page-jump label { font-weight: 400; white-space: nowrap; }
        .page-jump input { width: 64px; padding: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
        .page-jump input[aria-invalid="true"] { border-color: #b23b49; }
        .page-jump .btn { padding-inline: 12px; }
        .empty-state { padding: 64px 20px; text-align: center; color: var(--muted); }
        .empty-state > svg { width: 36px; height: 36px; color: #8b85b4; margin-bottom: 16px; }
        .empty-state h3 { color: #454257; font-size: 18px; margin-bottom: 8px; }
        .empty-state .btn { margin-top: 20px; }
        .loading-line { width: 160px; height: 3px; margin: 20px auto; background: #dfdcef; overflow: hidden; border-radius: 3px; }
        .loading-line::after { content: ''; display: block; width: 50%; height: 100%; background: var(--accent); animation: loading 1.4s ease-in-out infinite alternate; }
        @keyframes loading { to { transform: translateX(100%); } }
        .page-footer { color: var(--muted); font-size: 12px; padding-top: 24px; text-align: center; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; width: max-content; max-width: calc(100% - 32px); padding: 12px 20px; border-radius: 8px; background: #302d47; color: #fff; box-shadow: 0 6px 20px #25213d26; font-size: 14px; text-align: center; pointer-events: none; }
        @media (min-width: 1500px) { .workspace { gap: 36px; } }
        @media (max-width: 1024px) { .header-inner { padding: 14px 24px; } .workspace { padding: 24px; gap: 22px; grid-template-columns: 280px minmax(0, 1fr); } .filters { padding: 18px; } .total-stats { white-space: normal; max-width: 180px; text-align: right; } .favorite-label { display: none; } }
        @media (max-width: 760px) {
            .header-inner { padding: 12px 16px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; }
            .brand, .brand > div { display: contents; }
            .brand-mark { grid-column: 1; grid-row: 1 / 3; width: 28px; height: 28px; padding: 5px; border-radius: 7px; }
            h1 { grid-column: 2; grid-row: 1; font-size: 16px; line-height: 1.45; }
            .total-stats { grid-column: 2; grid-row: 2; text-align: left; max-width: none; margin: 0; font-size: 12px; }
            .workspace { display: block; padding: 18px 16px 32px; }
            .filters { position: static; max-height: none; padding: 18px; margin-bottom: 24px; overflow: visible; }
            .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
            .section-title { margin-bottom: 12px; }
            .advanced-filters { margin-top: 16px; padding-top: 10px; }
            .filter-actions { margin-top: 18px; }
            .saved-searches { margin-top: 14px; padding-top: 8px; }
            .results-toolbar { gap: 12px; }
            .view-button { padding: 8px 12px; }
            .sort-group { margin-left: auto; }
            .sort-group label { display: none; }
            .job-card { padding: 18px 16px 0; }
            .job-title { font-size: 17px; }
            .job-header { gap: 10px; }
            .job-unit { font-size: 13px; }
            .job-requirements { grid-template-columns: 60px minmax(0, 1fr); gap: 9px 10px; font-size: 13px; }
            .job-details .job-requirements { grid-template-columns: 60px minmax(0, 1fr); }
            .results-heading { margin-top: 18px; }
            .pagination { justify-content: center; }
            .page-controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; order: -1; }
            .page-controls .btn { padding-inline: 4px; }
            .page-status { grid-column: 1 / -1; grid-row: 1; text-align: center; }
            .favorite-label { display: none; }
        }
        @media (max-width: 360px) { .workspace { padding-inline: 12px; } .filters { padding: 15px; } .results-toolbar { align-items: stretch; } .sort-group { margin-left: 0; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#resultsHeading">跳转到职位结果</a>
    <header class="page-header">
        <div class="header-inner">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5h16v16M8 5V3h8v2M2 21h20M8 9h2m4 0h2M8 13h2m4 0h2M10 21v-4h4v4"/></svg>
                <div>
                    <h1>江苏省2026年度公务员职位筛选</h1>
                </div>
            </div>
            <p class="total-stats" id="totalStats" role="status">正在读取职位数据…</p>
        </div>
    </header>
    <div class="workspace">
        <aside class="filters" aria-label="职位筛选条件">
            <form id="filterForm">
                <fieldset id="filterFields" disabled style="border:0;margin:0;padding:0;min-width:0">
                    <legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">设置职位筛选条件</legend>
                    <div class="section-title"><h2>筛选条件</h2><button type="button" class="text-button" id="resetFilters">重置</button></div>
                    <div class="filter-grid">
                        <div class="filter-group"><label for="cityFilter">城市 / 系统</label><select id="cityFilter"><option value="">全部地区</option></select></div>
                        <div class="filter-group"><label for="educationFilter">学历要求</label><select id="educationFilter"><option value="">全部学历</option></select></div>
                        <div class="filter-group"><label for="examTypeFilter">考试类别</label><select id="examTypeFilter"><option value="">全部类别</option><option value="A">A 类</option><option value="B">B 类</option><option value="C">C 类</option></select></div>
                        <div class="filter-group"><label for="recruitNumFilter">招考人数</label><select id="recruitNumFilter"><option value="">全部人数</option><option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人及以上</option></select></div>
                        <div class="filter-group"><label for="genderFilter">性别条件</label><select id="genderFilter"><option value="">全部条件</option><option value="male">男性可报</option><option value="female">女性可报</option><option value="no_requirement">无性别要求</option></select></div>
                        <div class="filter-group"><label for="newGraduateFilter">应届条件</label><select id="newGraduateFilter"><option value="">全部条件</option><option value="yes">要求应届</option><option value="no">未要求应届</option></select></div>
                        <div class="filter-group wide"><label for="majorSearch">所学专业</label><input type="search" id="majorSearch" placeholder="例如：计算机，电子信息" aria-describedby="majorHelp"><p class="field-help" id="majorHelp">多个专业用空格或逗号分隔，匹配其中任意一个。</p></div>
                    </div>
                    <details class="advanced-filters" id="advancedFilters">
                        <summary>更多条件与关键词</summary>
                        <div class="advanced-grid">
                            <div class="filter-group"><label for="unitSearch">单位名称</label><input type="search" id="unitSearch" placeholder="例如：教育局，财政局"></div>
                            <div class="filter-group"><label for="positionSearch">职位名称</label><input type="search" id="positionSearch" placeholder="例如：一级科员"></div>
                            <div class="filter-group"><label for="includeKeywords">必须包含</label><input type="search" id="includeKeywords" placeholder="例如：学士 计算机" aria-describedby="includeHelp"><p class="field-help" id="includeHelp">搜索职位全部信息，需同时包含每个关键词。</p></div>
                            <div class="filter-group"><label for="excludeKeywords">排除关键词</label><input type="search" id="excludeKeywords" placeholder="例如：基层工作经历" aria-describedby="excludeHelp"><p class="field-help" id="excludeHelp">任意信息包含其中一个关键词，即排除该职位。</p></div>
                        </div>
                    </details>
                    <div class="filter-actions"><button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>筛选职位</button><button type="button" class="btn" id="saveSearch">保存条件</button></div>
                </fieldset>
            </form>
            <details class="saved-searches" id="searchHistoryPanel"><summary>已保存的搜索 <span id="historyCount">0</span></summary><div id="searchHistoryList"><p class="field-help">还没有保存的搜索条件。</p></div></details>
        </aside>
        <main class="results" aria-label="职位搜索结果">
            <div class="results-toolbar">
                <div class="view-switch" role="group" aria-label="职位范围">
                    <button type="button" class="view-button" id="allJobsView" aria-pressed="true" disabled>全部职位</button>
                    <button type="button" class="view-button" id="favoritesView" aria-pressed="false" disabled>我的收藏 <span class="favorites-count" id="favoritesCount">0</span></button>
                </div>
                <div class="sort-group"><label for="sortOrder">排序</label><select id="sortOrder" aria-label="结果排序" disabled><option value="default">默认排序</option><option value="recruit">招考人数最多</option></select></div>
            </div>
            <div class="results-heading" id="resultsHeading" tabindex="-1">
                <h2 id="resultSummary" aria-live="polite" aria-atomic="true">找到 <span class="result-count" id="resultCount">—</span> 个职位</h2>
                <p class="results-meta" id="resultsMeta"></p>
            </div>
            <div class="active-filters" id="activeFilters" aria-label="已应用的筛选条件" hidden></div>
            <div id="resultsContainer" aria-label="职位列表" aria-busy="true"><div class="empty-state" role="status"><p>正在读取职位数据…</p><div class="loading-line"></div></div></div>
            <nav class="pagination" id="pagination" aria-label="结果分页" hidden>
                <div class="sort-group"><label for="pageSize">每页</label><select id="pageSize" aria-label="每页职位数量"><option value="20">20 个 / 页</option><option value="50">50 个 / 页</option><option value="100">100 个 / 页</option></select></div>
                <div class="page-controls"><button type="button" class="btn" id="firstPage">首页</button><button type="button" class="btn" id="previousPage">上一页</button><span class="page-status" id="pageStatus" aria-live="polite" aria-atomic="true"></span><button type="button" class="btn" id="nextPage">下一页</button><button type="button" class="btn" id="lastPage">末页</button></div>
                <form class="page-jump" id="pageJumpForm" novalidate><label for="jumpPageNumber">跳至</label><input type="number" id="jumpPageNumber" min="1" step="1" value="1" inputmode="numeric" aria-label="跳转页码" aria-describedby="pageStatus"><span>页</span><button type="submit" class="btn" id="jumpPageButton">跳转</button></form>
            </nav>
            <footer class="page-footer">收藏与搜索条件保存在当前浏览器。</footer>
        </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const filterFields = {
            city: ['cityFilter', '城市'], education: ['educationFilter', '学历'],
            examType: ['examTypeFilter', '类别'], recruitNum: ['recruitNumFilter', '人数'],
            gender: ['genderFilter', '性别'], newGraduate: ['newGraduateFilter', '应届'],
            majorSearch: ['majorSearch', '专业'], unitSearch: ['unitSearch', '单位'],
            positionSearch: ['positionSearch', '职位'], includeKeywords: ['includeKeywords', '包含'],
            excludeKeywords: ['excludeKeywords', '排除']
        };
        let allJobs = [], filteredJobs = [], favorites = [], history = [];
        let currentPage = 1, pageSize = 20, favoritesOnly = false, loaded = false;
        let filterTimer, toastTimer;
        let activeConditions = {};
        const starIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>';
        const closeIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>';
        const searchIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>';
        const numberFormat = new Intl.NumberFormat('zh-CN');
        const count = value => numberFormat.format(value);

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
        }
        function readStorage(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
        }
        function writeStorage(key, value, notify = true) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch { if (notify) showToast('无法保存，请允许浏览器使用本地存储后重试。'); return false; }
        }
        function showToast(message) {
            clearTimeout(toastTimer);
            $('toast').textContent = message;
            $('toast').hidden = false;
            toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3200);
        }
        // 保留原有标识规则，兼容已经收藏的职位。
        function generateJobId(job) {
            return [job.c, job.rn, job.uc, job.pc].map(value => value || '').join('_').replace(/\s+/g, '_');
        }
        function readConditions() {
            return Object.fromEntries(Object.entries(filterFields).map(([key, [id]]) => [key, $(id).value.trim()]));
        }
        function setConditions(conditions) {
            Object.entries(filterFields).forEach(([key, [id]]) => {
                $(id).value = typeof conditions[key] === 'string' ? conditions[key] : '';
            });
            $('advancedFilters').open = ['unitSearch', 'positionSearch', 'includeKeywords', 'excludeKeywords'].some(key => $(filterFields[key][0]).value);
        }
        function splitSearchKeywords(value) {
            return [...new Set(String(value || '').trim().toLowerCase().split(/[,，;；\s]+/).filter(Boolean))];
        }
        function matchesAnyKeyword(text, keywords) {
            return !keywords.length || keywords.some(keyword => String(text || '').toLowerCase().includes(keyword));
        }
        function applyFilters(resetPage = true) {
            if (!loaded) return;
            clearTimeout(filterTimer);
            activeConditions = readConditions();
            const c = activeConditions;
            const unit = splitSearchKeywords(c.unitSearch), position = splitSearchKeywords(c.positionSearch);
            const major = splitSearchKeywords(c.majorSearch), include = splitSearchKeywords(c.includeKeywords), exclude = splitSearchKeywords(c.excludeKeywords);
            const source = favoritesOnly ? favorites : allJobs;
            filteredJobs = source.filter(job => {
                if (c.city && job.c !== c.city) return false;
                if (c.education && job.ed !== c.education) return false;
                if (c.examType && job.et !== c.examType) return false;
                const recruits = parseInt(job.rh, 10) || 0;
                if (c.recruitNum && (c.recruitNum === '3' ? recruits < 3 : recruits !== Number(c.recruitNum))) return false;
                const other = String(job.ot || '');
                const male = other.includes('男性'), female = other.includes('女性');
                if (c.gender === 'male' && female && !male) return false;
                if (c.gender === 'female' && male && !female) return false;
                if (c.gender === 'no_requirement' && (male || female)) return false;
                const graduate = /应届毕业生/.test(String(job.pd || '') + ' ' + other);
                if (c.newGraduate === 'yes' && !graduate) return false;
                if (c.newGraduate === 'no' && graduate) return false;
                if (!matchesAnyKeyword(job.un, unit) || !matchesAnyKeyword(job.pn, position) || !matchesAnyKeyword(job.mj, major)) return false;
                if (include.length || exclude.length) {
                    const text = ['c','r','rc','rn','uc','un','pc','pn','pd','et','kr','rh','ed','mj','ot'].map(key => job[key] || '').join(' ').toLowerCase();
                    if (!include.every(keyword => text.includes(keyword)) || exclude.some(keyword => text.includes(keyword))) return false;
                }
                return true;
            });
            if ($('sortOrder').value === 'recruit') filteredJobs.sort((a, b) => (parseInt(b.rh, 10) || 0) - (parseInt(a.rh, 10) || 0));
            if (resetPage) currentPage = 1;
            writeStorage('lastSearchConditions', c, false);
            renderActiveFilters();
            renderResults();
        }
        function resetFilters() { setConditions({}); applyFilters(); }
        function conditionLabels(conditions) {
            return Object.entries(filterFields).filter(([key]) => conditions[key]).map(([key, [id, label]]) => {
                const input = $(id);
                const option = input.tagName === 'SELECT' ? [...input.options].find(item => item.value === conditions[key]) : null;
                return { key, text: `${label}：${option ? option.textContent : conditions[key]}` };
            });
        }
        function renderActiveFilters() {
            const labels = conditionLabels(activeConditions);
            $('activeFilters').hidden = !labels.length;
            $('activeFilters').innerHTML = labels.map(({key, text}) => `<button type="button" class="filter-chip" data-remove-filter="${key}" aria-label="移除${escapeHtml(text)}">${escapeHtml(text)}${closeIcon}</button>`).join('');
        }
        function createJobCard(job, favoriteIds) {
            const id = escapeHtml(generateJobId(job)), favorited = favoriteIds.has(generateJobId(job));
            const region = job.rn && job.rn !== job.c ? `${job.c || ''} · ${job.rn.replace(job.c || '', '')}` : job.c;
            const tags = [
                region ? `<span class="tag location">${escapeHtml(region)}</span>` : '',
                job.rh ? `<span class="tag recruit">招考 ${escapeHtml(job.rh)} 人</span>` : '',
                job.ed ? `<span class="tag">${escapeHtml(job.ed)}</span>` : '',
                job.et ? `<span class="tag">${escapeHtml(job.et)} 类</span>` : ''
            ].join('');
            return `<article class="job-card" aria-label="${escapeHtml(job.un)} ${escapeHtml(job.pn)}">
                <header class="job-header"><div><h3 class="job-title">${escapeHtml(job.pn || '未指定职位名称')}</h3><p class="job-unit">${escapeHtml(job.un || '未指定单位')}</p></div>
                <button type="button" class="btn favorite-button" data-favorite="${id}" aria-pressed="${favorited}" aria-label="${favorited ? '取消收藏' : '收藏'}：${escapeHtml(job.un)} ${escapeHtml(job.pn)}">${starIcon}<span class="favorite-label">${favorited ? '已收藏' : '收藏'}</span></button></header>
                <div class="job-tags" aria-label="职位基本条件">${tags}</div>
                <dl class="job-requirements"><dt>专业要求</dt><dd>${escapeHtml(job.mj || '未注明')}</dd><dt>其他要求</dt><dd>${escapeHtml(job.ot || '未注明')}</dd></dl>
                <details class="job-details"><summary>职位详情与代码</summary><dl class="job-requirements">
                    <dt>职位简介</dt><dd>${escapeHtml(job.pd || '未注明')}</dd>
                    <dt>单位代码</dt><dd>${escapeHtml(job.uc || '未注明')}</dd><dt>职位代码</dt><dd>${escapeHtml(job.pc || '未注明')}</dd>
                    <dt>地区名称</dt><dd>${escapeHtml(job.rn || job.c || '未注明')}</dd><dt>地区代码</dt><dd>${escapeHtml(job.rc || '未注明')}</dd>
                    <dt>隶属关系</dt><dd>${escapeHtml(job.r || '未注明')}</dd><dt>开考比例</dt><dd>${escapeHtml(job.kr || '未注明')}</dd>
                </dl><div class="detail-actions"><button type="button" class="btn" data-copy="${id}">复制职位信息</button></div></details>
            </article>`;
        }
        function getTotalPages() { return Math.max(1, Math.ceil(filteredJobs.length / pageSize)); }
        function renderResults() {
            const total = filteredJobs.length, pages = getTotalPages();
            currentPage = Math.min(Math.max(currentPage, 1), pages);
            const start = (currentPage - 1) * pageSize;
            const favoriteIds = new Set(favorites.map(generateJobId));
            $('resultCount').textContent = count(total);
            $('resultsMeta').textContent = total ? `显示第 ${count(start + 1)}–${count(Math.min(start + pageSize, total))} 个` : (favoritesOnly ? '当前范围：我的收藏' : '试试减少一个筛选条件');
            $('favoritesCount').textContent = count(favorites.length);
            $('allJobsView').setAttribute('aria-pressed', String(!favoritesOnly));
            $('favoritesView').setAttribute('aria-pressed', String(favoritesOnly));
            $('pagination').hidden = total === 0;
            $('pageStatus').textContent = `${currentPage} / ${pages} 页`;
            $('firstPage').disabled = currentPage === 1;
            $('previousPage').disabled = currentPage === 1;
            $('nextPage').disabled = currentPage === pages;
            $('lastPage').disabled = currentPage === pages;
            $('jumpPageNumber').max = pages;
            $('jumpPageNumber').value = currentPage;
            $('jumpPageNumber').disabled = pages === 1;
            $('jumpPageButton').disabled = pages === 1;
            $('jumpPageNumber').setCustomValidity('');
            $('jumpPageNumber').removeAttribute('aria-invalid');
            if (total) {
                $('resultsContainer').innerHTML = filteredJobs.slice(start, start + pageSize).map(job => createJobCard(job, favoriteIds)).join('');
            } else {
                const emptyFavorites = favoritesOnly && !favorites.length;
                $('resultsContainer').innerHTML = `<div class="empty-state">${emptyFavorites ? starIcon : searchIcon}<h3>${emptyFavorites ? '还没有收藏的职位' : '没有找到符合条件的职位'}</h3><p>${emptyFavorites ? '在职位旁点击收藏，方便下次继续比较。' : '可以移除上方条件，或重置筛选后重新查找。'}</p><button type="button" class="btn" data-empty-action="${emptyFavorites ? 'all' : 'reset'}">${emptyFavorites ? '浏览全部职位' : '重置筛选'}</button></div>`;
            }
            document.title = `江苏省2026年度公务员职位筛选 · ${favoritesOnly ? '收藏 ' : ''}${count(total)} 个职位`;
        }
        function toggleFavorite(id) {
            const index = favorites.findIndex(job => generateJobId(job) === id);
            const job = filteredJobs.find(item => generateJobId(item) === id);
            if (!job) return;
            const updated = [...favorites];
            if (index >= 0) updated.splice(index, 1); else updated.push(job);
            if (!writeStorage('jobFavorites', updated)) return;
            favorites = updated;
            applyFilters(false);
            const button = [...$('resultsContainer').querySelectorAll('[data-favorite]')].find(item => item.dataset.favorite === id);
            if (button) button.focus({ preventScroll: true });
            showToast(index >= 0 ? '已取消收藏' : '已加入我的收藏');
        }
        function renderHistory() {
            $('historyCount').textContent = history.length;
            $('searchHistoryList').innerHTML = history.length ? history.map((item, index) => `<div class="history-row"><time>${escapeHtml(item.saveTime || '已保存的搜索')}</time><p>${escapeHtml(conditionLabels(item).map(label => label.text).join(' · ') || '全部职位')}</p><div class="history-actions"><button type="button" class="btn" data-load-history="${index}" ${loaded ? '' : 'disabled'}>应用条件</button><button type="button" class="text-button" data-delete-history="${index}">删除</button></div></div>`).join('') : '<p class="field-help">点击“保存条件”，下次可以直接应用。</p>';
        }
        function saveSearchHistory() {
            const conditions = readConditions();
            const signature = JSON.stringify(conditions);
            const updated = [{...conditions, saveTime: new Date().toLocaleString('zh-CN')}, ...history.filter(item => JSON.stringify(Object.fromEntries(Object.keys(filterFields).map(key => [key, item[key] || '']))) !== signature)].slice(0, 20);
            if (!writeStorage('searchHistory', updated)) return;
            history = updated;
            renderHistory();
            showToast('搜索条件已保存');
        }
        async function copyJob(id) {
            const job = filteredJobs.find(item => generateJobId(item) === id);
            if (!job) return;
            const fields = {c:'城市 / 系统', rn:'地区', un:'单位', uc:'单位代码', pn:'职位', pc:'职位代码', rh:'招考人数', ed:'学历', mj:'专业', ot:'其他要求', pd:'职位简介', et:'考试类别', kr:'开考比例'};
            const text = Object.entries(fields).map(([key, label]) => `${label}：${job[key] || '未注明'}`).join('\n');
            try { await navigator.clipboard.writeText(text); showToast('已复制完整职位信息'); }
            catch { showToast('复制失败，请展开详情后选择文字复制。'); }
        }
        function setPage(page) {
            currentPage = page;
            renderResults();
            focusResults();
        }
        function jumpToPage(event) {
            event.preventDefault();
            const input = $('jumpPageNumber');
            const page = Number(input.value), pages = getTotalPages();
            if (!Number.isInteger(page) || page < 1 || page > pages) {
                input.setCustomValidity(`请输入 1 至 ${pages} 之间的整数页码。`);
                input.setAttribute('aria-invalid', 'true');
                input.reportValidity();
                input.focus();
                return;
            }
            setPage(page);
        }
        function focusResults() {
            $('resultsHeading').focus({ preventScroll: true });
            $('resultsHeading').scrollIntoView({ behavior: 'instant', block: 'start' });
        }
        function switchView(onlyFavorites) { favoritesOnly = onlyFavorites; applyFilters(); }
        async function loadData() {
            loaded = false;
            $('filterFields').disabled = true;
            ['allJobsView', 'favoritesView', 'sortOrder'].forEach(id => { $(id).disabled = true; });
            $('resultsContainer').setAttribute('aria-busy', 'true');
            $('resultsContainer').innerHTML = '<div class="empty-state" role="status"><p>正在读取职位数据…</p><div class="loading-line"></div></div>';
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data.data) || !data.data.length || !data.data.every(job => job && typeof job === 'object' && typeof job.pn === 'string' && typeof job.c === 'string')) throw new Error('invalid data');
                allJobs = data.data;
                const cities = [...new Set(allJobs.map(job => job.c).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
                const education = [...new Set(allJobs.map(job => job.ed).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
                $('cityFilter').innerHTML = '<option value="">全部地区</option>';
                $('educationFilter').innerHTML = '<option value="">全部学历</option>';
                cities.forEach(city => $('cityFilter').add(new Option(city, city)));
                education.forEach(value => $('educationFilter').add(new Option(value, value)));
                $('totalStats').textContent = `${count(allJobs.length)} 个职位 · ${cities.length} 个地区与系统`;
                const storedFavorites = readStorage('jobFavorites', []), storedHistory = readStorage('searchHistory', []);
                favorites = Array.isArray(storedFavorites) ? storedFavorites.filter(job => job && typeof job === 'object' && typeof job.pn === 'string' && typeof job.c === 'string') : [];
                history = Array.isArray(storedHistory) ? storedHistory.filter(item => item && typeof item === 'object' && !Array.isArray(item)).slice(0, 20) : [];
                const last = readStorage('lastSearchConditions', {});
                setConditions(last && typeof last === 'object' ? last : {});
                loaded = true;
                $('filterFields').disabled = false;
                ['allJobsView', 'favoritesView', 'sortOrder'].forEach(id => { $(id).disabled = false; });
                renderHistory();
                applyFilters();
            } catch {
                $('totalStats').textContent = '职位数据暂时无法读取';
                const message = '职位数据暂时无法读取，请刷新页面或稍后重试。';
                $('resultsContainer').innerHTML = `<div class="empty-state"><h3>职位数据加载失败</h3><p>${escapeHtml(message)}</p><button type="button" class="btn btn-primary" data-retry>重新加载</button></div>`;
                $('resultsMeta').textContent = '';
                $('pagination').hidden = true;
            } finally { $('resultsContainer').setAttribute('aria-busy', 'false'); }
        }
        $('filterForm').addEventListener('submit', event => {
            event.preventDefault();
            applyFilters();
            if (window.matchMedia('(max-width: 760px)').matches) focusResults();
        });
        $('filterForm').addEventListener('change', event => { if (event.target.tagName === 'SELECT') applyFilters(); });
        $('filterForm').addEventListener('input', event => {
            if (event.target.tagName !== 'INPUT') return;
            clearTimeout(filterTimer);
            filterTimer = setTimeout(() => applyFilters(), 250);
        });
        $('resetFilters').addEventListener('click', resetFilters);
        $('saveSearch').addEventListener('click', saveSearchHistory);
        $('sortOrder').addEventListener('change', () => applyFilters());
        $('allJobsView').addEventListener('click', () => switchView(false));
        $('favoritesView').addEventListener('click', () => switchView(true));
        $('firstPage').addEventListener('click', () => setPage(1));
        $('previousPage').addEventListener('click', () => setPage(currentPage - 1));
        $('nextPage').addEventListener('click', () => setPage(currentPage + 1));
        $('lastPage').addEventListener('click', () => setPage(getTotalPages()));
        $('pageJumpForm').addEventListener('submit', jumpToPage);
        $('jumpPageNumber').addEventListener('input', () => {
            $('jumpPageNumber').setCustomValidity('');
            $('jumpPageNumber').removeAttribute('aria-invalid');
        });
        $('pageSize').addEventListener('change', () => { pageSize = Number($('pageSize').value); setPage(1); });
        $('activeFilters').addEventListener('click', event => {
            const button = event.target.closest('[data-remove-filter]');
            if (!button) return;
            const id = filterFields[button.dataset.removeFilter][0];
            $(id).value = '';
            applyFilters();
            $(id).focus({ preventScroll: true });
        });
        $('resultsContainer').addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;
            if (button.hasAttribute('data-favorite')) toggleFavorite(button.dataset.favorite);
            else if (button.hasAttribute('data-copy')) copyJob(button.dataset.copy);
            else if (button.hasAttribute('data-retry')) loadData();
            else if (button.dataset.emptyAction === 'all') switchView(false);
            else if (button.dataset.emptyAction === 'reset') resetFilters();
        });
        $('searchHistoryList').addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;
            if (button.hasAttribute('data-load-history')) {
                const item = history[Number(button.dataset.loadHistory)];
                if (item && loaded) { setConditions(item); applyFilters(); showToast('已应用保存的搜索条件'); }
            } else if (button.hasAttribute('data-delete-history')) {
                const updated = history.filter((_, index) => index !== Number(button.dataset.deleteHistory));
                if (writeStorage('searchHistory', updated)) { history = updated; renderHistory(); showToast('已删除搜索条件'); }
            }
        });
        loadData();
    </script>
</body>
</html>
